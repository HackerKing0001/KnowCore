<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>KNOWCORE — Case Study Generator</title>

  <meta
    name="description"
    content="KNOWCORE academic case-study generator with live Wikipedia data, editable front page, and print-ready PDF output."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --paper:#F5F1E6;
      --paper2:#EFE9D8;
      --ink:#211F1B;
      --soft:#4A4538;
      --rule:#D8CFB4;
      --green:#2F5233;
      --green2:#3F6B47;
      --gold:#A6802E;
      --rust:#8A3B2B;
      --white:#fffdf7;
      --shadow:0 18px 50px rgba(32,28,20,.12);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:
        radial-gradient(circle at top left,rgba(63,107,71,.08),transparent 30%),
        var(--paper);
      color:var(--ink);
      font-family:Inter,Arial,sans-serif;
    }

    /* ================= HEADER ================= */

    .masthead{
      text-align:center;
      padding:30px 20px 24px;
      border-bottom:1px solid var(--rule);
      background:rgba(245,241,230,.92);
    }

    .ganesh-top{
      width:64px;
      height:64px;
      margin:0 auto 10px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--green);
      color:#fff;
      font-size:30px;
      font-family:Georgia,serif;
      overflow:hidden;
      border:3px solid var(--gold);
    }

    .ganesh-top img{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#fff;
    }

    .brand{
      margin:0;
      font-family:Fraunces,Georgia,serif;
      font-size:48px;
      line-height:1;
      letter-spacing:-1px;
    }

    .brand span{
      color:var(--green);
    }

    .tagline{
      margin-top:9px;
      color:var(--soft);
      font-size:13px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    /* ================= APP ================= */

    .app{
      max-width:1180px;
      margin:0 auto;
      padding:30px 20px 70px;
    }

    .builder{
      background:rgba(255,253,247,.88);
      border:1px solid var(--rule);
      border-radius:18px;
      padding:28px;
      box-shadow:var(--shadow);
    }

    .builder h2{
      margin:0 0 7px;
      font-family:Fraunces,Georgia,serif;
      font-size:30px;
    }

    .builder-subtitle{
      margin:0 0 25px;
      color:var(--soft);
      line-height:1.6;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }

    .full{
      grid-column:1/-1;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
      font-size:13px;
    }

    input,
    select{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--rule);
      border-radius:10px;
      background:#fff;
      color:var(--ink);
      font:inherit;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:var(--green2);
      box-shadow:0 0 0 3px rgba(63,107,71,.10);
    }

    .choice-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .choice{
      border:1px solid var(--rule);
      background:#fff;
      border-radius:10px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:600;
    }

    .choice.active{
      background:var(--green);
      color:#fff;
      border-color:var(--green);
    }

    .page-buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .page-btn{
      min-width:65px;
      padding:11px 16px;
      border:1px solid var(--rule);
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      font-weight:700;
    }

    .page-btn.active{
      background:var(--green);
      color:#fff;
      border-color:var(--green);
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:25px;
    }

    button{
      font:inherit;
    }

    .primary{
      background:var(--green);
      color:white;
      border:0;
      padding:13px 22px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
    }

    .primary:hover{
      background:var(--green2);
    }

    .secondary{
      background:transparent;
      color:var(--green);
      border:1px solid var(--green);
      padding:12px 20px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
    }

    /* ================= RESULT ================= */

    .hidden{
      display:none!important;
    }

    #result{
      margin-top:35px;
    }

    .result-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .result-head h2{
      margin:0;
      font-family:Fraunces,Georgia,serif;
      font-size:30px;
    }

    .result-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .preview-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

    /* ================= A4 PAGE ================= */

    .paper-page{
      width:794px;
      min-height:1123px;
      padding:70px 72px;
      background:#fffdf8;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .cover{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .cover-logo{
      width:105px;
      height:105px;
      border-radius:50%;
      border:3px solid var(--gold);
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:30px;
      overflow:hidden;
      background:var(--green);
      color:white;
      font-size:48px;
      font-family:Georgia,serif;
    }

    .cover-logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#fff;
    }

    .cover h1{
      font-family:Fraunces,Georgia,serif;
      font-size:45px;
      line-height:1.1;
      margin:0 0 15px;
    }

    .cover .subtitle{
      font-family:Newsreader,Georgia,serif;
      font-size:23px;
      color:var(--green);
      margin-bottom:40px;
    }

    .cover-info{
      width:100%;
      max-width:520px;
      border-top:1px solid var(--rule);
      padding-top:25px;
      text-align:left;
    }

    .cover-info div{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:8px 0;
      border-bottom:1px solid rgba(216,207,180,.6);
    }

    .cover-info strong{
      color:var(--green);
    }

    .doc h1{
      font-family:Fraunces,Georgia,serif;
      font-size:36px;
      line-height:1.15;
      margin:0 0 10px;
    }

    .doc-meta{
      color:#77705f;
      font-size:12px;
      margin-bottom:28px;
    }

    .doc section{
      margin-bottom:25px;
    }

    .doc h2{
      font-family:Fraunces,Georgia,serif;
      color:var(--green);
      font-size:23px;
      margin:0 0 10px;
      padding-bottom:7px;
      border-bottom:1px solid var(--rule);
    }

    .doc p{
      font-family:Newsreader,Georgia,serif;
      font-size:18px;
      line-height:1.62;
      margin:0 0 12px;
    }

    .page-label{
      position:absolute;
      bottom:25px;
      left:72px;
      right:72px;
      text-align:center;
      color:#8a8475;
      font-size:10px;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    /* ================= LOADING ================= */

    .loading{
      text-align:center;
      padding:50px;
      color:var(--soft);
      font-weight:600;
    }

    .error{
      padding:20px;
      border-radius:10px;
      background:#fff0ec;
      border:1px solid #e0b3a6;
      color:#7a3023;
      line-height:1.6;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:850px){

      .grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .paper-page{
        width:100%;
        min-height:auto;
        padding:45px 35px;
      }

      .cover{
        min-height:850px;
      }

      .brand{
        font-size:40px;
      }
    }

    /* ================= PRINT ================= */

    @media print{

      @page{
        size:A4;
        margin:0;
      }

      body{
        background:#fff;
      }

      .masthead,
      .builder,
      .result-head{
        display:none!important;
      }

      .app{
        margin:0;
        padding:0;
        max-width:none;
      }

      #result{
        margin:0;
      }

      .preview-wrap{
        display:block;
      }

      .paper-page{
        width:210mm;
        height:297mm;
        min-height:297mm;
        padding:18mm 18mm;
        margin:0;
        box-shadow:none;
        overflow:hidden;
        page-break-after:always;
        break-after:page;
      }

      .paper-page:last-child{
        page-break-after:auto;
        break-after:auto;
      }

      .print-hide,
      .doc-meta,
      .page-label,
      .source-section{
        display:none!important;
      }
    }
  </style>
</head>

      KNOW<span>CORE</span>

    <div class="tagline">
      Research • Understand • Present
    </div>

  </header>


  <main class="app">

    <!-- ================= BUILDER ================= -->

    <section class="builder">

      <h2>Create Your Case Study</h2>

      <p class="builder-subtitle">
        Enter a topic and KNOWCORE will collect relevant information
        from Wikipedia and prepare an editable academic case study.
      </p>

      <div class="grid">

        <div class="full">
          <label for="topic">Topic / Subject</label>
          <input
            id="topic"
            type="text"
            placeholder="e.g. Professional Responsibility of Engineers"
          >
        </div>


        <div>
          <label>Front Page</label>

          <div class="choice-row">
            <button class="choice active" id="frontYes">
              Yes
            </button>

            <button class="choice" id="frontNo">
              No
            </button>
          </div>
        </div>


        <div>
          <label for="logoUpload">
            College / University Logo
          </label>

          <input
            id="logoUpload"
            type="file"
            accept="image/*"
          >
        </div>


        <div>
          <label for="college">
            College / University
          </label>

          <input
            id="college"
            type="text"
            placeholder="Your college name"
          >
        </div>


        <div>
          <label for="course">
            Course / Branch
          </label>

          <input
            id="course"
            type="text"
            placeholder="e.g. B.Tech CSE"
          >
        </div>


        <div>
          <label for="studentName">
            Student Name
          </label>

          <input
            id="studentName"
            type="text"
            placeholder="Your name"
          >
        </div>


        <div>
          <label for="roll">
            Roll Number
          </label>

          <input
            id="roll"
            type="text"
            placeholder="Roll number"
          >
        </div>


        <div>
          <label for="date">
            Date
          </label>

          <input
            id="date"
            type="date"
          >
        </div>


        <div class="full">
          <label for="assignment">
            Assignment Title
          </label>

          <input
            id="assignment"
            type="text"
            placeholder="Case Study / Assignment"
          >
        </div>


        <div class="full">

          <label>
            Number of Pages
          </label>

          <div class="page-buttons">

            <button class="page-btn" data-pages="3">
              3
            </button>

            <button class="page-btn active" data-pages="5">
              5
            </button>

            <button class="page-btn" data-pages="6">
              6
            </button>

            <button class="page-btn" data-pages="8">
              8
            </button>

          </div>

        </div>

      </div>


      <div class="actions">

        <button class="primary" id="generate">
          Generate Case Study
        </button>

        <button class="secondary" id="demo">
          Load Sample
        </button>

      </div>

    </section>


    <!-- ================= RESULT ================= -->

    <section id="result" class="hidden">

      <div class="result-head">

        <h2>Your Case Study</h2>

        <div class="result-actions">

          <button class="secondary" id="back">
            ← Edit
          </button>

          <button class="primary" id="print">
            Print / Save PDF
          </button>

        </div>

      </div>

      <div id="preview" class="preview-wrap"></div>

    </section>

    /* ================= STATE ================= */

    const state = {
      front: true,
      pages: 5,
      logo: null
    };


    /* ================= PAGE BUTTONS ================= */

    document.querySelectorAll(".page-btn").forEach(btn => {

      btn.addEventListener("click", () => {

        document
          .querySelectorAll(".page-btn")
          .forEach(x => x.classList.remove("active"));

        btn.classList.add("active");

        state.pages = Number(btn.dataset.pages);

      });

    });


    /* ================= FRONT PAGE ================= */

    $("frontYes").onclick = () => {

      state.front = true;

      $("frontYes").classList.add("active");
      $("frontNo").classList.remove("active");

    };


    $("frontNo").onclick = () => {

      state.front = false;

      $("frontNo").classList.add("active");
      $("frontYes").classList.remove("active");

    };


    /* ================= LOGO UPLOAD ================= */

    $("logoUpload").addEventListener("change", event => {

      const file = event.target.files[0];

      if(!file){
        state.logo = null;
        return;
      }

      const reader = new FileReader();

      reader.onload = e => {
        state.logo = e.target.result;
      };

      reader.readAsDataURL(file);

    });


    /* ================= GANESH LOGO ================= */

    function setGaneshLogo(imageURL){

      if(!imageURL) return;

      $("ganeshLogo").innerHTML = `
        <img src="${imageURL}" alt="Ganesh Ji">
      `;

    }


    /* ================= ESCAPE HTML ================= */

    function esc(text){

      return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    /* ================= WORD COUNT ================= */

    function countWords(text){

      return String(text || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

    }


    /* ================= TRUNCATE ================= */

    function truncateToWordBudget(text,budget){

      const words = String(text || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if(words.length <= budget){
        return words.join(" ");
      }

      return words.slice(0,budget).join(" ") + "...";

    }


    /* ================= WIKIPEDIA SEARCH ================= */

    async function wikiFindTitle(topic){

      const url =
        "https://en.wikipedia.org/w/api.php" +
        "?action=query" +
        "&list=search" +
        "&srsearch=" + encodeURIComponent(topic) +
        "&format=json" +
        "&origin=*";

      const response = await fetch(url);

      if(!response.ok){
        throw new Error("Wikipedia search failed.");
      }

      const data = await response.json();

      if(
        !data.query ||
        !data.query.search ||
        !data.query.search.length
      ){
        throw new Error(
          "No Wikipedia article was found for this topic."
        );
      }

      return data.query.search[0].title;

    }


    /* ================= WIKIPEDIA FETCH ================= */

    async function wikiFetchExtract(title){

      const url =
        "https://en.wikipedia.org/w/api.php" +
        "?action=query" +
        "&prop=extracts|info" +
        "&explaintext=1" +
        "&exsectionformat=plain" +
        "&inprop=url" +
        "&titles=" + encodeURIComponent(title) +
        "&format=json" +
        "&origin=*";

      const response = await fetch(url);

      if(!response.ok){
        throw new Error(
          "Could not fetch Wikipedia article."
        );
      }

      const data = await response.json();

      const pages = data.query.pages;

      const page = Object.values(pages)[0];

      if(!page || !page.extract){
        throw new Error(
          "Wikipedia article has no readable content."
        );
      }

      return {
        title: page.title,
        extract: page.extract,
        url: page.fullurl ||
          `https://en.wikipedia.org/wiki/${encodeURIComponent(
            page.title.replace(/ /g,"_")
          )}`
      };

    }


    /* ================= PARSE SECTIONS ================= */

    const EXCLUDED_HEADINGS =
      /^(see also|references|external links|further reading|notes|bibliography|citations|sources|gallery|footnotes)$/i;


    function parseExtractIntoSections(extract){

      const lines = String(extract || "")
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);

      const sections = [];

      let currentHeading = "Overview";
      let currentText = [];

      function pushCurrent(){

        const text = currentText.join(" ").trim();

        if(
          text &&
          !EXCLUDED_HEADINGS.test(currentHeading)
        ){

          sections.push([
            currentHeading,
            text
          ]);

        }

      }

      for(const line of lines){

        const looksLikeHeading =
          line.length < 100 &&
          (
            /^[A-Z][A-Za-z0-9 ,:&()'’\-]+$/.test(line) &&
            !/[.!?]$/.test(line)
          );

        if(looksLikeHeading){

          pushCurrent();

          currentHeading = line;
          currentText = [];

        }else{

          currentText.push(line);

        }

      }

      pushCurrent();

      return sections;

    }


    /* ================= BUILD WITH WORD BUDGET ================= */

    function buildSectionsWithinBudget(
      introText,
      sections,
      pages
    ){

      const targetWords = {
        3: 900,
        5: 1650,
        6: 2000,
        8: 2650
      };

      const budget =
        targetWords[pages] ||
        1650;

      const output = [];

      let used = 0;

      const introBudget =
        Math.min(
          320,
          Math.floor(budget * .20)
        );

      const intro =
        truncateToWordBudget(
          introText,
          introBudget
        );

      if(intro){

        output.push([
          "Overview",
          intro
        ]);

        used += countWords(intro);

      }


      for(const section of sections){

        if(used >= budget){
          break;
        }

        const remaining = budget - used;

        const sectionBudget =
          Math.min(
            remaining,
            Math.max(
              180,
              Math.floor(budget * .16)
            )
          );

        const text =
          truncateToWordBudget(
            section[1],
            sectionBudget
          );

        if(!text) continue;

        output.push([
          section[0],
          text
        ]);

        used += countWords(text);

      }


      return output;

    }


    /* ================= FETCH CASE STUDY ================= */

    async function fetchCaseStudyData(
      topic,
      pages
    ){

      const wikiTitle =
        await wikiFindTitle(topic);

      const wiki =
        await wikiFetchExtract(wikiTitle);

      const sections =
        parseExtractIntoSections(
          wiki.extract
        );

      const content =
        buildSectionsWithinBudget(
          wiki.extract,
          sections,
          pages
        );


      content.push([
        "References",
        `Source: Wikipedia — ${wiki.title}\n${wiki.url}`
      ]);


      return {

        title: wiki.title,

        topic,

        sourceURL: wiki.url,

        sections: content

      };

    }


    /* ================= PARAGRAPH ================= */

    function para(text){

      return String(text || "")
        .split(/\n+/)
        .filter(Boolean)
        .map(
          x => `<p>${esc(x)}</p>`
        )
        .join("");

    }


    /* ================= COVER ================= */

    function renderCover(data){

      const logoHTML =
        `<img src="${state.logo || GANESH_LOGO_DATA_URI}" alt="Logo">`;


      return `

        <div class="paper-page cover">

          <div class="cover-logo">
            ${logoHTML}
          </div>

          <h1>
            ${esc(
              $("assignment").value ||
              "Case Study"
            )}
          </h1>

          <div class="subtitle">
            ${esc(data.title)}
          </div>

          <div class="cover-info">

            <div>
              <strong>College</strong>
              <span>
                ${esc($("college").value || "—")}
              </span>
            </div>

            <div>
              <strong>Course</strong>
              <span>
                ${esc($("course").value || "—")}
              </span>
            </div>

            <div>
              <strong>Student</strong>
              <span>
                ${esc($("studentName").value || "—")}
              </span>
            </div>

            <div>
              <strong>Roll No.</strong>
              <span>
                ${esc($("roll").value || "—")}
              </span>
            </div>

            <div>
              <strong>Date</strong>
              <span>
                ${esc($("date").value || "—")}
              </span>
            </div>

          </div>

        </div>

      `;

    }


    /* ================= DOCUMENT ================= */

    function renderDoc(data){

      let html = `

        <div
          class="paper-page doc"
          contenteditable="true"
        >

          <h1>
            ${esc(data.title)}
          </h1>

          <div class="doc-meta print-hide">
            KNOWCORE Academic Case Study · Editable Draft
          </div>

      `;


      data.sections.forEach(section => {

        const isReference =
          section[0] === "References";

        html += `

          <section
            class="${isReference ? "source-section" : ""}"
          >

            <h2>
              ${esc(section[0])}
            </h2>

            ${para(section[1])}

          </section>

        `;

      });


      html += `

          <div class="page-label print-hide">
            Generated with KNOWCORE
          </div>

        </div>

      `;


      return html;

    }


    /* ================= BUILD ================= */

    async function build(){

      const topic =
        $("topic").value.trim();

      if(!topic){

        alert(
          "Please enter a topic first."
        );

        return;

      }


      $("result").classList.remove("hidden");

      $("preview").innerHTML = `
        <div class="loading">
          Fetching information from Wikipedia...
        </div>
      `;


      try{

        const data =
          await fetchCaseStudyData(
            topic,
            state.pages
          );


        let html = "";


        if(state.front){

          html += renderCover(data);

        }


        html += renderDoc(data);


        $("preview").innerHTML = html;

        $("result").scrollIntoView({
          behavior:"smooth"
        });


      }catch(error){

        console.error(error);

        $("preview").innerHTML = `

          <div class="error">

            <strong>
              Something went wrong.
            </strong>

            <br><br>

            ${esc(error.message)}

            <br><br>

            Make sure you are connected to the
            internet and that Wikipedia is accessible.

          </div>

        `;

      }

    }


    /* ================= DEMO ================= */

    $("demo").onclick = () => {

      $("topic").value =
        "Professional Responsibility of Engineers";

      $("college").value =
        "Your College / University";

      $("course").value =
        "B.Tech / Engineering";

      $("studentName").value =
        "Student Name";

      $("roll").value =
        "12345";

      $("assignment").value =
        "Professional Responsibility of Engineers";

      const today =
        new Date().toISOString().split("T")[0];

      $("date").value = today;

      state.front = true;

      $("frontYes").classList.add("active");
      $("frontNo").classList.remove("active");

      state.pages = 5;

      document
        .querySelectorAll(".page-btn")
        .forEach(btn => {

          btn.classList.toggle(
            "active",
            Number(btn.dataset.pages) === 5
          );

        });

      build();

    };


    /* ================= BACK ================= */

    $("back").onclick = () => {

      $("result").classList.add("hidden");

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };


    /* ================= PRINT ================= */

    $("print").onclick = () => {

      window.print();

    };


    /* ================= GENERATE ================= */

    $("generate").onclick = build;


    /* ================= DEFAULT DATE ================= */

    $("date").value =
      new Date().toISOString().split("T")[0];

  </script>
